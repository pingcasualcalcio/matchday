<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>Calcio Time. Who’s In?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bevan&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3ead4;--page:#e6dcc2;--blue:#1f3fb5;--gold:#e8a33d;--ink:#231f1c;--disp:'Bevan',Georgia,'Times New Roman',serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--page);color:var(--blue);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.35}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;opacity:.45;mix-blend-mode:multiply;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .42 0 0 0 0 .28 0 0 0 1.4 -.45'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.tag{position:relative;width:calc(100% - 24px);max-width:440px;margin:18px auto;padding:30px 22px 26px 40px;background:var(--paper);border:2px solid var(--blue);outline:3px solid var(--blue);outline-offset:-12px;box-shadow:0 3px 10px rgba(60,40,10,.25)}
.tag::before{content:"";position:absolute;left:20px;top:46px;bottom:22px;border-left:3px dashed var(--blue)}
.hole{position:absolute;left:12px;top:14px;width:15px;height:15px;border-radius:50%;background:var(--page);box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
.loz{background:repeating-linear-gradient(90deg,#1f3fb5 0 3px,#2d52cc 3px 4px);clip-path:polygon(0 50%,7% 0,93% 0,100% 50%,93% 100%,7% 100%);padding:20px 30px;text-align:center;margin:2px -4px 16px}
h1{font:400 1.55rem/1.1 var(--disp);margin:0;color:var(--paper);text-transform:uppercase;letter-spacing:.02em}
.sub{margin:0;text-align:center;font:400 1.05rem/1.3 var(--disp);text-transform:uppercase;letter-spacing:.04em}
.sub span{display:block;font:700 .68rem system-ui,sans-serif;letter-spacing:.16em;margin-top:7px}
.star{width:34px;height:34px;margin:14px auto 10px;background:var(--gold);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.roundel{width:104px;height:104px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:var(--gold);border:6px solid var(--ink);box-shadow:inset 0 0 0 4px var(--gold),inset 0 0 0 6px var(--ink)}
.roundel b{font:400 1.7rem var(--disp);color:var(--blue)}
.state{margin:8px 0 12px;text-align:center;font:400 .9rem var(--disp);text-transform:uppercase;letter-spacing:.08em}
.bar{height:10px;border:2px solid var(--blue);border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .3s}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;padding:11px 12px;border:2px solid var(--blue);border-radius:6px;background:transparent;color:var(--blue);font-size:1rem;font-weight:700}
input::placeholder{color:var(--blue);opacity:.5;font-weight:500}
button{padding:11px 18px;border:2px solid var(--blue);border-radius:6px;background:var(--blue);color:var(--paper);font:400 1rem var(--disp);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.msg{margin:8px 0 0;font-size:.85rem;font-weight:600;min-height:1.2em}
.msg.err{color:#a4260a}
.banner{background:var(--gold);border:2px solid var(--blue);border-radius:6px;padding:10px;text-align:center;font:400 .95rem var(--disp);margin-bottom:4px}
ol{list-style:none;margin:14px 0 0;padding:0}
li{display:flex;gap:10px;padding:9px 2px;border-bottom:2px dashed rgba(31,63,181,.45);font-weight:700;font-size:1.05rem}
li .n{width:24px;opacity:.55}
li.empty{opacity:.45;font-style:italic;font-weight:500}
.foot{margin:26px 0 4px;text-align:center;font:400 1.15rem var(--disp);letter-spacing:.08em;text-transform:uppercase}
.tagline{margin:0;text-align:center;font-size:.62rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
.worn{filter:url(#rough)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/></filter></svg>
<div class="tag"><div class="hole"></div>
<main>
  <div class="loz worn"><h1>Calcio Time.<br>Who’s In?</h1></div>
  <p class="sub">First 10 names play.<span>Grab your spot before it’s gone!</span></p>
  <div class="star"></div>
  <div class="roundel worn"><b id="count">0/10</b></div>
  <p class="state" id="state"></p>
  <div class="bar"><i id="fill"></i></div>
  <div id="closed" class="banner" hidden>Registration is closed. 10 players are set!</div>
  <div class="row" id="formRow">
    <input id="name" type="text" maxlength="24" placeholder="Your name" autocomplete="name">
    <button id="join">Join</button>
  </div>
  <p class="msg" id="msg"></p>
  <ol id="list"></ol>
  <p class="foot worn">Ci vediamo in campo.</p>
  <p class="tagline">Accept no excuses</p>
</main></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Firebase config for the Casual Calcio project
const firebaseConfig = {
  apiKey: "AIzaSyBiAiJSc713oV1ZO7eTHRNKfeLB4IKpNLc",
  authDomain: "casual-calcio.firebaseapp.com",
  projectId: "casual-calcio",
  storageBucket: "casual-calcio.firebasestorage.app",
  messagingSenderId: "304424883053",
  appId: "1:304424883053:web:21c2a637605dbccf2e8064"
};

// 2) Each match gets its own list. Share a new link per match: yoursite.com/?m=oct-18
const MATCH = (new URLSearchParams(location.search).get("m") || "default").replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 40) || "default";
const TOTAL = 10;
const ids = Array.from({length: TOTAL}, (_, i) => "s" + String(i + 1).padStart(2, "0"));

const $ = id => document.getElementById(id);
const setMsg = (t, err) => { $("msg").textContent = t || ""; $("msg").className = "msg" + (err ? " err" : ""); };
const KEY = "joined:" + MATCH;
let joined = false; try { joined = !!localStorage.getItem(KEY); } catch (e) {}

let db, slots = {}, busy = false;
try { db = getFirestore(initializeApp(firebaseConfig)); } catch (e) { setMsg("Setup incomplete: check the Firebase config.", true); }

function render() {
  const list = $("list"); list.textContent = "";
  let taken = 0;
  ids.forEach((id, i) => {
    const li = document.createElement("li");
    const n = document.createElement("span"); n.className = "n"; n.textContent = i + 1;
    const t = document.createElement("span");
    if (slots[id]) { taken++; t.textContent = slots[id]; } else { li.className = "empty"; t.textContent = "Open spot"; }
    li.append(n, t); list.append(li);
  });
  const full = taken >= TOTAL;
  $("count").textContent = taken + "/" + TOTAL;
  $("fill").style.width = (taken / TOTAL * 100) + "%";
  $("state").textContent = full ? "CLOSED" : (TOTAL - taken) + " left";
  $("closed").hidden = !full;
  $("formRow").hidden = full;
  $("join").disabled = busy || joined;
  $("name").disabled = joined;
  if (joined && !full) setMsg("You're in! See you on the pitch.");
}

async function claim(name) {
  for (const id of ids) {
    if (slots[id]) continue;
    try {
      // Rules only allow creating a slot that doesn't exist yet, so two people can never share a spot.
      await setDoc(doc(db, "matches", MATCH, "slots", id), { name, at: Date.now() });
      return true;
    } catch (e) {
      if (e && e.code === "permission-denied") continue; // someone else got it first
      throw e;
    }
  }
  return false;
}

$("join").addEventListener("click", async () => {
  const name = $("name").value.trim();
  if (!name) { setMsg("Please type your name.", true); return; }
  busy = true; render(); setMsg("Saving your spot…");
  try {
    if (await claim(name)) {
      joined = true; try { localStorage.setItem(KEY, "1"); } catch (e) {}
      setMsg("You're in! See you on the pitch.");
    } else setMsg("Sorry, all 10 spots just filled up.", true);
  } catch (e) { setMsg("Could not save your name. Check your connection and try again.", true); }
  busy = false; render();
});
$("name").addEventListener("keydown", e => { if (e.key === "Enter") $("join").click(); });

render();
if (db) {
  onSnapshot(collection(db, "matches", MATCH, "slots"), snap => {
    const next = {};
    snap.forEach(d => { next[d.id] = d.data().name; });
    slots = next; render();
  }, () => setMsg("Could not load the list. Check the Firebase setup.", true));
}
</script>
</body>
</html>
